name: Validate AdenClean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py store.py auth.py create_admin.py setup_appwrite.py export_backup.py

      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/admin.js
          node --check static/feedback.js

      - name: Check static pages and repository safety rules
        run: python -m unittest discover -s tests -v
